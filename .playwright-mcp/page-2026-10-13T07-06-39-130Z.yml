        - paragraph [ref=e199]: "The results that didn’t fit in the table mattered just as much:"
        - list [ref=e200]:
          - listitem [ref=e201]:
            - strong [ref=e202]: The triage desk changed jobs.
            - text: Instead of reading every ticket, they handled the ~15% the system wasn’t sure about, and they owned the eval set. Their labeling became the team’s quality signal.
          - listitem [ref=e203]:
            - strong [ref=e204]: Two other teams shipped faster.
            - text: The sales summarizer and document classifier launched on the gateway with timeouts, budgets, fallbacks, and logging from day one. Neither had a model-related incident in its first quarter.
          - listitem [ref=e205]:
            - strong [ref=e206]: Model upgrades became boring.
            - text: When a newer model came out, the team ran the evals, saw a small accuracy gain and lower cost, canaried it, and switched in two days. Boring is the goal.
          - listitem [ref=e207]:
            - strong [ref=e208]: Cost became a conversation, not a surprise.
            - text: Each feature had a budget and a cost-per-task chart. Finance stopped finding out first.
        - heading "What made this principal-level work" [level=2] [ref=e209]
        - paragraph [ref=e210]: "The code changes here weren’t hard. A queue, a schema, an idempotency key, a thin library. Any senior engineer could write them. What made it principal-level was everything around the code:"
        - list [ref=e211]:
          - listitem [ref=e212]:
            - strong [ref=e213]: Seeing the pattern behind the incidents.
            - text: Five incidents, one root cause. Fixing them one at a time would have taken longer and taught nobody anything.
          - listitem [ref=e214]:
            - strong [ref=e215]: Reframing the problem for leadership.
            - text: “Unmanaged dependency on the critical path” got time and support that “the AI needs work” never would have.
          - listitem [ref=e216]:
            - strong [ref=e217]: Choosing what not to build.
            - text: No agent, no model swap, no big-bang rewrite, no platform team.
          - listitem [ref=e218]:
            - strong [ref=e219]: Designing for the next two teams, not just this one.
            - text: The gateway’s biggest payoff was in features this team never touched.
          - listitem [ref=e220]:
            - strong [ref=e221]: Making safety measurable.
            - text: Evals in CI, shadow mode, canaries, and cost budgets turned “we think it’s fine” into numbers anyone could check.
          - listitem [ref=e222]:
            - strong [ref=e223]: Changing the human process, not just the system.
            - text: The triage desk became the safety net and the source of truth for quality.
        - paragraph [ref=e224]:
          - text: "The lasting test from the original post applies here:"
          - emphasis [ref=e225]: if we swapped this model out tomorrow, what would break?
          - text: Before, the answer was “we don’t know.” After, it was “run the evals and canary it.” That shift, more than any metric, was the real impact.
