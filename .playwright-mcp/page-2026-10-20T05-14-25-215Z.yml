        - paragraph [ref=f1e442]: "What this buys you:"
        - list [ref=f1e443]:
          - listitem [ref=f1e444]:
            - strong [ref=f1e445]: Predictable behavior under load.
            - text: At peak, tasks wait in a visible queue instead of failing randomly halfway through.
          - listitem [ref=f1e446]:
            - strong [ref=f1e447]: Priority.
            - text: An interactive user’s task can jump ahead of a nightly batch job.
          - listitem [ref=f1e448]:
            - strong [ref=f1e449]: Fairness.
            - text: Per-tenant limits stop one heavy customer from consuming everyone’s capacity.
          - listitem [ref=f1e450]:
            - strong [ref=f1e451]: Graceful degradation.
            - text: Under heavy load, you can route lower-priority work to a smaller, cheaper model or a lower reasoning-effort setting instead of rejecting it.
        - heading "Your own tools become the bottleneck" [level=3] [ref=f1e452]
        - paragraph [ref=f1e453]: Agents are very good at load-testing your internal APIs by accident. A hundred concurrent agents, each calling a search tool five times in parallel, is 500 simultaneous requests to a service that was sized for a human-driven UI.
        - paragraph [ref=f1e454]: "Before scaling agents, check every tool they call:"
        - list [ref=f1e455]:
          - listitem [ref=f1e456]: Does the downstream service have the capacity for agent traffic, not just human traffic?
          - listitem [ref=f1e457]: Does the tool have its own timeout, rate limit, and circuit breaker?
          - listitem [ref=f1e458]: Is it safe to call twice? Agents retry and repeat themselves. Any tool that writes data needs an idempotency key.
        - heading "4. Long-running tasks need durable state" [level=2] [ref=f1e459]
        - paragraph [ref=f1e460]: An agent that runs for ten minutes can’t live inside an HTTP request. Connections drop, pods restart during deploys, and providers have brief outages. If the agent’s state only exists in memory, any of those means starting over, and paying for every step again.
        - paragraph [ref=f1e461]: "Treat a long agent task like a workflow, not a request:"
