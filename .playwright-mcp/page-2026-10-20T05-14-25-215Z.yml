          - generic [ref=f1e25]: backend
        - paragraph [ref=f1e26]: The first agent demo always feels fast. One question, a few tool calls, a good answer in fifteen seconds. Then it goes to a hundred users, then a thousand, and the same agent takes two minutes, hits rate limits at lunchtime, and costs more per task than the person it was meant to help.
        - paragraph [ref=f1e27]:
          - text: Nothing changed in the code. What changed is that agent performance problems
          - strong [ref=f1e28]: compound
          - text: . Each one is small on its own. Multiplied across steps, users, and retries, they become the whole story.
        - paragraph [ref=f1e29]:
          - text: This post is about where that compounding happens and what actually helps. If you haven’t decided yet whether you need an agent at all, start with
          - link "Agent vs. Pipeline" [ref=f1e30] [cursor=pointer]:
            - /url: /blog/agent-vs-pipeline
          - text: . Most performance problems are cheapest to solve by not having them.
        - heading "Why agents are different from a single LLM call" [level=2] [ref=f1e31]
        - paragraph [ref=f1e32]:
          - text: A single model call has one latency and one cost. An agent is a
          - strong [ref=f1e33]: loop
          - text: ": the model thinks, calls a tool, reads the result, and decides again. Every trip around the loop re-sends the growing conversation."
