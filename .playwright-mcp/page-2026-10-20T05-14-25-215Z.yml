        - list [ref=f1e511]:
          - listitem [ref=f1e512]:
            - strong [ref=f1e513]: Checkpoint after every step.
            - text: If the worker dies at step 14, a new worker resumes at step 15 instead of step 1.
          - listitem [ref=f1e514]:
