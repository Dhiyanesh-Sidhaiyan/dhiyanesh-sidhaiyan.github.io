              - paragraph [ref=f1e647]: Could this be apipeline instead?
              - paragraph [ref=f1e654]: Replace the loopwith fixed steps
              - paragraph [ref=f1e661]: Trim tool resultsand cache the prefix
              - paragraph [ref=f1e668]: "Cut steps: stronger tools,parallel calls, preload data"
              - paragraph [ref=f1e675]: Right-size the model:smaller model or lowereffort for simple steps
              - paragraph [ref=f1e682]: Move heavy readinginto sub-agents
              - paragraph [ref=f1e689]: Queue, budgets, andadmission control for scale
        - paragraph [ref=f1e690]:
          - text: Notice what’s
          - emphasis [ref=f1e691]: not
          - text: "on the list early: switching to a faster model. It’s tempting because it’s a one-line change, but it rarely fixes an agent that takes too many steps or carries too much context. It just makes a bad loop run a bit faster."
        - heading "The tradeoffs worth being honest about" [level=2] [ref=f1e692]
        - paragraph [ref=f1e693]: "Every fix above has a cost:"
        - list [ref=f1e694]:
          - listitem [ref=f1e695]:
            - strong [ref=f1e696]: Stronger tools mean less flexibility.
            - text: A tool that does three things in one call is faster, and the model can no longer combine those pieces in new ways.
          - listitem [ref=f1e697]:
            - strong [ref=f1e698]: Parallel calls make failures messier.
            - text: When three calls run at once and one fails, the agent and your error handling have to cope with partial results.
          - listitem [ref=f1e699]:
            - strong [ref=f1e700]: Clearing context can cause rework.
            - text: Drop a tool result the agent needed later, and it calls the tool again. Measure before and after.
          - listitem [ref=f1e701]:
            - strong [ref=f1e702]: Sub-agents add hops.
            - text: They save main-context tokens but add their own latency and their own failure modes. They pay off for heavy reading, not for small lookups.
          - listitem [ref=f1e703]:
            - strong [ref=f1e704]: Queues make peak-time waits visible.
            - text: That’s honest and better than random failures, but someone has to agree that “your task is 4th in line” is an acceptable experience.
        - paragraph [ref=f1e705]: None of these are reasons to skip the fixes. They’re reasons to measure each one instead of applying all of them at once.
        - heading "The takeaway" [level=2] [ref=f1e706]
        - paragraph [ref=f1e707]: Agent performance isn’t one problem you solve once. It’s a few small effects, more steps, bigger context, more calls per request, multiplying each other. The teams that scale agents well don’t have a faster model than everyone else. They have fewer steps, smaller contexts, a queue in front of the provider, and a dashboard that shows steps and tokens per task.
        - paragraph [ref=f1e708]:
          - text: "The question to ask before every agent launches:"
          - strong [ref=f1e709]: what does one task cost in steps, tokens, and seconds, and what happens when a thousand of them run at once?
          - text: If nobody can answer that yet, it isn’t ready to scale. For the dependency side of the same picture, timeouts, fallbacks, and contracts, see
          - link "The LLM Is a Backend Dependency" [ref=f1e710] [cursor=pointer]:
            - /url: /blog/llm-as-a-backend-dependency
          - text: .
