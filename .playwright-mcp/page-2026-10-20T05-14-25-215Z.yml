        - paragraph [ref=f1e337]: That last loop is the nasty part. Very long contexts can also make the model less focused, which causes mistakes, which causes more steps. Performance and quality problems feed each other.
        - heading "What actually controls context growth" [level=3] [ref=f1e338]
        - list [ref=f1e339]:
          - listitem [ref=f1e340]:
            - strong [ref=f1e341]: Keep tool results small.
            - text: The single biggest win in most agents. A tool that returns a 30k-token JSON blob when the model needed three fields is a performance bug. Return summaries, the fields that matter, and a way to ask for more (pagination, an ID to fetch details).
          - listitem [ref=f1e342]:
            - strong [ref=f1e343]: Cache the stable prefix.
            - text: Providers cache prompts by exact prefix. Keep the system prompt and tool definitions identical across calls and put them first. In an agent loop, the conversation history is also a stable prefix that only grows, so it caches well too, as long as you only append and never edit earlier turns. Cached input is typically billed at a small fraction of the normal price and processed faster.
          - listitem [ref=f1e344]:
            - strong [ref=f1e345]: Clear what’s no longer needed.
            - text: "Old tool results the agent has already acted on can often be dropped or replaced with a one-line note. Many platforms now support clearing old tool results or summarizing (compacting) older history automatically. Use it, but test it: dropping the wrong thing causes the agent to redo work."
          - listitem [ref=f1e346]:
            - strong [ref=f1e347]: Split long tasks into sub-agents.
            - text: A sub-agent that reads twenty documents and returns a one-paragraph finding keeps those twenty documents out of the main agent’s context. You pay for the sub-agent’s tokens once, instead of re-sending them on every later step.
        - paragraph [ref=f1e348]: "Back to the example: with tool results trimmed from 4k to 1.5k per step and the prefix cached, the same 20-step task drops from 840k full-price input tokens to roughly 315k, most of them served from cache. Same agent, same answers, a fraction of the cost."
        - 'heading "3. Capacity: tokens are the scarce resource, not CPU" [level=2] [ref=f1e349]'
        - heading "One request is not one request" [level=3] [ref=f1e350]
        - paragraph [ref=f1e351]: In a normal web service, one user request is roughly one unit of work. With agents, one user request becomes 5, 20, or 50 model calls, each with a growing context. Your servers will be mostly idle while you hit the provider’s limits.
        - paragraph [ref=f1e352]:
          - text: Model providers rate-limit on
          - strong [ref=f1e353]: requests per minute
          - text: and
          - strong [ref=f1e354]: tokens per minute
          - text: ". For agents, the token limit almost always hits first. A worked example:"
        - blockquote [ref=f1e355]:
          - paragraph [ref=f1e356]:
            - text: Each task uses about 300k input tokens (after trimming). Your account allows 2M input tokens per minute.
            - strong [ref=f1e357]: Maximum throughput ≈ 6 or 7 tasks per minute,
            - text: no matter how many servers you run.
        - paragraph [ref=f1e358]: That’s the number to put in the capacity plan. Adding pods doesn’t move it. Only fewer tokens per task, caching (cached tokens often count differently against limits), higher limits, or spreading load across providers or regions moves it.
        - heading "Protect the system with a queue, not with retries" [level=3] [ref=f1e359]
        - paragraph [ref=f1e360]:
          - text: "When an agent fleet hits rate limits, the natural reaction is retrying, and that makes it worse: every retry re-sends a big context and burns more of the same limit. The fix is"
          - strong [ref=f1e361]: admission control
          - text: ": decide how many agents run at once, and queue the rest."
