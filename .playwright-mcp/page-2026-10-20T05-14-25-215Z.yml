        - heading "5. The development loop is a performance problem too" [level=2] [ref=f1e518]
        - paragraph [ref=f1e519]:
          - text: "Teams talk about agent performance in production and forget the one that slows them down every day:"
          - strong [ref=f1e520]: iteration speed
          - text: .
        - paragraph [ref=f1e521]: Testing an agent is slow and expensive. A real run takes a minute and costs real money. Results vary run to run. A twenty-case eval suite can take half an hour and still not tell you clearly whether your change helped.
        - paragraph [ref=f1e522]: "What keeps the development loop fast:"
        - document [ref=f1e524]:
          - generic [ref=f1e527]:
            - paragraph [ref=f1e534]: Code or promptchange
            - paragraph [ref=f1e541]: Unit tests:tools in isolationseconds
            - paragraph [ref=f1e548]: Replay tests:recorded model andtool responsesseconds
            - paragraph [ref=f1e555]: Small live eval:20 key casesminutes
            - paragraph [ref=f1e562]: Full eval suitein CIbefore merge
            - paragraph [ref=f1e569]: Canary inproduction
        - list [ref=f1e570]:
          - listitem [ref=f1e571]:
            - strong [ref=f1e572]: Test tools without the model.
            - text: "Most agent bugs are ordinary tool bugs: a bad query, a missing field, a slow endpoint. Plain unit tests catch them in seconds."
          - listitem [ref=f1e573]:
            - strong [ref=f1e574]: Record and replay.
            - text: Capture a real run’s model responses and tool results, then replay them to test your loop logic, checkpointing, and error handling without calling the model at all. Fast, free, and repeatable.
          - listitem [ref=f1e575]:
            - strong [ref=f1e576]: Keep a small “smoke” eval.
            - text: Twenty carefully chosen tasks that run in a few minutes, for quick feedback during development. Save the full suite for CI.
          - listitem [ref=f1e577]:
            - strong [ref=f1e578]: Run evals several times.
            - text: Agents vary between runs. One pass/fail tells you little. Three runs and a pass rate tells you a lot more.
          - listitem [ref=f1e579]:
            - strong [ref=f1e580]: Track steps and tokens per task in every eval.
            - text: A change that keeps accuracy the same but adds four steps per task is a performance regression. Catch it before production does.
        - heading "6. Measure the things that actually move" [level=2] [ref=f1e581]
        - paragraph [ref=f1e582]: "Generic monitoring won’t show you any of the problems above. For agents, the useful numbers are:"
        - table [ref=f1e583]:
          - rowgroup [ref=f1e584]:
