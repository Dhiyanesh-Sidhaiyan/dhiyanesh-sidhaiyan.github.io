        - paragraph [ref=f1e239]: Same tools, same model, less than half the time. And two fewer model calls, each re-sending the whole conversation, means lower cost too.
        - heading "Tail latency multiplies" [level=3] [ref=f1e240]
        - paragraph [ref=f1e241]: "Averages hide the real problem. Suppose any single step has a 1 in 100 chance of being slow (a cold tool, a provider hiccup, a long model response). For one call, that’s rare. For a 20-step agent:"
        - blockquote [ref=f1e242]:
          - paragraph [ref=f1e243]:
            - text: Chance at least one step is slow = 1 − 0.99²⁰ ≈
            - strong [ref=f1e244]: 18%
        - paragraph [ref=f1e245]:
          - text: Nearly one in five tasks hits a slow step. Your agent’s typical experience is shaped by the
          - emphasis [ref=f1e246]: worst
          - text: step, not the average one. This is why agents that look fine in a benchmark feel sluggish in production.
        - paragraph [ref=f1e247]: "What helps:"
        - list [ref=f1e248]:
          - listitem [ref=f1e249]:
            - strong [ref=f1e250]: Per-step timeouts,
            - text: not just a timeout on the whole task. A tool that normally takes 200ms and is now taking 20 seconds should fail fast and let the model try something else.
          - listitem [ref=f1e251]:
            - strong [ref=f1e252]: Hedge slow, safe reads.
            - text: For read-only tools with high tail latency, sending a second request after a short delay and taking whichever returns first is cheap insurance.
          - listitem [ref=f1e253]:
            - strong [ref=f1e254]: Stream progress to the user.
            - text: If a task truly needs 40 seconds, showing “searching invoices…” changes how long it
            - emphasis [ref=f1e255]: feels
            - text: ", even though it doesn’t change how long it takes."
