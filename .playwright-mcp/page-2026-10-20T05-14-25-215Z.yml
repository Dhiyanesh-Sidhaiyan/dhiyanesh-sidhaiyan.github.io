        - paragraph [ref=f1e610]: The distribution of steps per task is the one I’d look at first. When an agent is slow or expensive, it’s rarely because the average task got worse. It’s usually because a small share of tasks are wandering, taking three or four times the normal number of steps. Find those tasks, read their traces, and you’ll usually find a missing tool, a confusing tool result, or an unclear instruction.
        - heading "Where to start" [level=2] [ref=f1e611]
        - paragraph [ref=f1e612]: When an agent is too slow or too expensive, work in this order. The early steps are cheaper and usually give more back.
        - document [ref=f1e614]:
          - generic [ref=f1e616]:
